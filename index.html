<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTS Events Team 2026</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#billboard {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

.slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
}

.slide.active {
    opacity: 1;
}
</style>
</head>

<body>

<div id="billboard"></div>

<script>

const eventTeam = [
    "DJTwiOct_1.png",
    "BTS_banner Sweets.png",
    "Colorado.png",
    "DJ_Bama.png",
    "DJ_Ghost.png",
    "GingerRocks_logo.png",
    "Lana DJ Banner.png",
    "Mars.png",
    "TwYsTeD_TaM_DJ_with_awards.png",
    "Ave.png",
    "Honey&Hero.png",
    "Jas_banner.png",
    "Lana Hosting Banner.png",
    "mew_banner_for_sweets_may_2026.png",
    "Pinkie3.png",
    "rora.png",
    "Roses.png",
    "Sassy-Purple-2026.png",
    "Twi hostess.png",
    "Wyatt-s-Banner-For-Hosting.png",
    "AdeWhiLOGOB.jpg",
    "alexis.png",
    "blackbird.png",
    "Blairxoxo_Spammer.jpg",
    "blessi.png",
    "chelzie.jpg",
    "claudee.png",
    "DD-Banner.png",
    "erika.png",
    "Fantasia.png",
    "Fantasiax.png",
    "Greeter19.png",
    "hannah.png",
    "Hunny.png",
    "Josa-Spamm.png",
    "Kali_Greeter_Banner.png",
    "Lushy_Smartass.png",
    "PinkieLLMC_Spammer_Banner.png",
    "PRME_BLADE_DSS.png",
    "sarah.png",
    "serena.png",
    "sexbomb.png",
    "Sexybeauty315_Spammer.jpg",
    "Shubi4u.png",
    "slay.jpg",
    "Smile_08Scorpion_Spammer.jpg",
    "spicy.png",
    "SunshineeXO_Spammer1.jpg",
    "TimWildd_Spammer1.jpg"
];

const billboard = document.getElementById("billboard");

let current = 0;
const slides = [];

eventTeam.forEach((filename, index) => {
    const img = document.createElement("img");

    img.src = encodeURI(filename);
    img.className = "slide";
    img.alt = "BTS Events Team";

    if (index === 0) {
        img.classList.add("active");
    }

    billboard.appendChild(img);
    slides.push(img);
});

if (slides.length > 1) {
    setInterval(() => {
        slides[current].classList.remove("active");

        current = (current + 1) % slides.length;

        slides[current].classList.add("active");
    }, 8000);
}

</script>

</body>
</html>
